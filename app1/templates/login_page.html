{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #B3CFE2;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #F8F8F8;
            padding: 40px;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            margin-bottom: 5px;
            display: block;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .submit-btn {
            background-color: rgb(186, 92, 98);
            border: none;
            color: #fff;
            padding: 10px;
            width: 100%;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }

        .submit-btn:hover {
            background-color: rgb(142, 55, 55);
        }

        .switch-to-signup {
            text-align: center;
            margin-top: 20px;
        }

        .switch-to-signup a {
            text-decoration: none;
            color: rgb(142, 55, 55);
            font-weight: bold;
        }

        .switch-to-signup a:hover {
            color: rgb(186, 92, 98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form  method="POST">
            {% csrf_token%}
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit" class="submit-btn">Login</button>
        </form>
        
        <div class="switch-to-signup">
            <p>Don't have an account? <a href="/signup">Sign Up here</a></p><br>

            <h3>{{error}}</h6>
        </div>
    </div>
</body>
</html>
